<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adelie Draw — 앱 안내</title>
<meta name="description" content="아델리드로우가 만드는 앱 안내 페이지입니다.">
<meta name="theme-color" content="#F8F8F8">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<style>
@font-face{font-family:"LINESeedKR";src:url("assets/fonts/LINESeedKR-Rg.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"LINESeedKR";src:url("assets/fonts/LINESeedKR-Bd.woff2") format("woff2");font-weight:700;font-display:swap}
:root{--indigo:#123F8D;--canvas:#F8F8F8;--text:#211C17;--text-2:#665E55;--text-3:#6F675E;--rule:#D8D8D5;--rule-strong:#BCBDBA}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;
  background-color:var(--canvas);background-image:url("assets/img/paper-grain.png");background-size:320px 320px;
  color:var(--text);font-family:"LINESeedKR",Pretendard,"Apple SD Gothic Neo",system-ui,-apple-system,sans-serif;
  line-height:1.65;-webkit-font-smoothing:antialiased;word-break:keep-all}
main{flex:1;width:100%;max-width:720px;margin-inline:auto;padding:clamp(56px,10vw,120px) 20px}
.eyebrow{margin:0 0 16px;font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--indigo)}
h1{margin:0;font-size:clamp(28px,5vw,42px);font-weight:700;letter-spacing:-.03em;line-height:1.2}
.lede{margin:24px 0 0;max-width:44ch;color:var(--text-2);font-size:16.5px}
.apps{list-style:none;margin:48px 0 0;padding:0;border-top:1px solid var(--rule)}
.apps li{border-bottom:1px solid var(--rule)}
.apps a{display:flex;align-items:center;gap:16px;padding:20px 4px;color:inherit;text-decoration:none}
.apps a:hover .name{color:var(--indigo)}
.apps img{width:44px;height:44px;border-radius:10px;flex:0 0 auto}
.name{display:block;font-weight:700;font-size:18px;letter-spacing:-.01em}
.desc{display:block;font-size:14px;color:var(--text-2)}
.arrow{margin-left:auto;color:var(--indigo);font-weight:700}
footer{border-top:1px solid var(--rule);padding:24px 20px;font-size:12.5px;color:var(--text-3)}
footer div{max-width:720px;margin-inline:auto} footer a{color:inherit;text-underline-offset:3px}
a:focus-visible{outline:2px solid #4E73B7;outline-offset:3px}
</style>
</head>
<body>
<main>
  <p class="eyebrow">ADELIE DRAW</p>
  <h1>아델리드로우가 만드는 앱.</h1>
  <p class="lede">아델리드로우의 캐릭터와 문구를 앱으로 옮기고 있습니다. 준비된 앱부터 이곳에 안내합니다.</p>
  <ul class="apps">
    <li>
      <a href="/pages/">
        <img src="assets/img/app-icon.webp" width="44" height="44" alt="">
        <span>
          <span class="name">Adelie Pages</span>
          <span class="desc">스티커팩으로 한 장을 만드는 디지털 문구 앱 · 출시 준비 중</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </li>
  </ul>
</main>
<footer><div>&copy; 2026 Adelie Draw. All rights reserved. · <a href="/pages/privacy/">개인정보처리방침</a> · <a href="/pages/terms/">이용약관</a> · <a href="/pages/support/">지원</a> · <a href="/pages/info/">앱 정보</a></div></footer>
</body>
</html>
