<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adelie Draw Shop</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://en.adeliedraw.com/">
<script>
// QR landing for the overseas shops: Japan → jp mall, everyone else → en mall.
// "Japan" = first browser language implies JP (ja, ja-JP, en-JP) or the device clock is on Tokyo time.
(() => {
  let japan = false;
  try {
    const tag = (navigator.languages && navigator.languages[0]) || navigator.language || '';
    japan = new Intl.Locale(tag).maximize().region === 'JP'
      || Intl.DateTimeFormat().resolvedOptions().timeZone === 'Asia/Tokyo';
  } catch { /* old browser or malformed tag: en */ }
  window.location.replace(japan ? 'https://jp.adeliedraw.com/' : 'https://en.adeliedraw.com/');
})();
</script>
<meta name="theme-color" content="#F8F8F8">
<link rel="icon" type="image/png" href="../assets/img/favicon.png">
<link rel="stylesheet" href="../brand/adelie-web.css">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--ad-s5);padding:var(--ad-section) var(--ad-gutter);text-align:center}

.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--ad-s3)}
</style>
</head>
