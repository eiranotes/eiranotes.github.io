<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173b34">
<title>Sapporo Autumn Fest 2026 · 9/14</title>
<style>
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;background:#173b34;color:#fff}#status{min-height:100vh;display:grid;place-items:center;padding:32px;text-align:center;box-sizing:border-box}b{font-size:22px}small{display:inline-block;margin-top:8px;opacity:.72;line-height:1.6}
</style>
</head>
<body>
<div id="status"><div><b>삿포로 오텀 페스트 2026</b><br><small>9/14 지도형 가이드를 불러오는 중입니다.</small></div></div>
<script>
(async()=>{
 const files=['part0.txt','part1.txt','part2.txt','part3.txt','part4.txt','tail0.txt','tail12.txt','tail3a.txt','tail56.txt','tail78.txt','tail9.txt'];
 try{
   const parts=await Promise.all(files.map(f=>fetch('./_parts/'+f,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f+' '+r.status);return r.text()})));
   const b64=parts.join('').replace(/\s/g,'');
   const bin=atob(b64);
   const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
   if(!('DecompressionStream' in window))throw new Error('브라우저 압축 해제를 지원하지 않습니다. Safari 또는 Chrome 최신 버전으로 열어주세요.');
   const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
   const page=await new Response(stream).text();
   document.open();document.write(page);document.close();
 }catch(e){
   document.getElementById('status').innerHTML='<div><b>페이지를 불러오지 못했습니다.</b><br><small>'+String(e.message||e)+'</small></div>';
 }
})();
</script>
</body>
</html>
